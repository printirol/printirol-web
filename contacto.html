<!doctype html>
<html lang="es" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | Printirol</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="preload" as="image" href="media/logos/logo.png">
  <link rel="icon" type="image/png" href="img/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="css/styles.css?v=44">
</head>
<body data-page="contacto">
  <div id="site-header"></div>

  <main>
    <section class="hero contact">
      <div class="container contact-grid">
        <div class="contact-copy">
          <h1 class="hero-title">Contactanos</h1>
          <p>¿Tenés alguna duda? Escribinos sin vueltas.</p>
          <p>Completá el formulario o mandanos un mail a <a href="mailto:hola@printirol.com">hola@printirol.com</a></p>
        </div>

        <form class="contact-form" data-contact-form novalidate>
          <div class="field">
            <label for="c-nombre">Nombre</label>
            <input class="input" id="c-nombre" name="nombre" type="text" placeholder="Nombre" autocomplete="given-name" required>
          </div>
          <div class="field">
            <label for="c-apellido">Apellido <span>(opcional)</span></label>
            <input class="input" id="c-apellido" name="apellido" type="text" placeholder="Pérez" autocomplete="family-name">
          </div>
          <div class="field">
            <label for="c-email">Email</label>
            <input class="input" id="c-email" name="email" type="email" placeholder="tu@email.com" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="c-whatsapp">WhatsApp <span>(opcional)</span></label>
            <input class="input" id="c-whatsapp" name="whatsapp" type="tel" placeholder="11 5502 8762" autocomplete="tel">
          </div>
          <div class="field field-full">
            <label for="c-mensaje">Mensaje</label>
            <textarea class="input textarea" id="c-mensaje" name="mensaje" rows="5" placeholder="¡Hola Printirol!" required></textarea>
          </div>
          <p class="contact-error field-full" data-contact-error hidden></p>
          <div class="field-full">
            <button class="btn btn-primary" type="submit">Enviar mensaje</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/main.js?v=44"></script>
</body>
</html>
